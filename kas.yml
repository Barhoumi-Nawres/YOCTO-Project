header:
  version: 14

machine: qemux86-64
distro: distro
target: custom-image
repos:
  poky:
    url: https://git.yoctoproject.org/poky
    path: poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:
  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    path: meta-openembedded
    branch: scarthgap
    layers:
      meta-python:
      meta-oe:

  meta-crunch:
   path: meta-crunch
local_conf_header:
  base: |
    CONF_VERSION = "2"
  diskom: |
    BB_DISKMON_DIRS ??= "\
      STOPTASKS,${TMPDIR},1G,100K \
      STOPTASKS,${DL_DIR},1G,100K \
      STOPTASKS,${SSTATE_DIR},1G,100K \
      STOPTASKS,/tmp,100M,100K \
      HALT,${TMPDIR},100M,1K \
      HALT,${DL_DIR},100M,1K \
      HALT,${SSTATE_DIR},100M,1K \
      HALT,/tmp,10M,1K"


bblayers_conf_header:
  custom-bblayers-conf: |
    POKY_BBLAYERS_CONF_VERSION = "2"
